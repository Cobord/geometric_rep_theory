[package]
name = "geometric_rep_theory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Algebraic and geometric structures arising in mathematical physics and mirror symmetry."
repository = "https://github.com/Cobord/geometric_rep_theory"
documentation = "https://docs.rs/geometric_rep_theory"
readme = "README.md"
keywords = ["quiver", "cluster-algebra", "toric", "homological-algebra", "representation"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
nonempty = "0.12.0"
petgraph = "0.8.3"
nalgebra = "0.33"
itertools = "0.14.0"
qhull = "0.4.0"
num = "0.4.3"

[dev-dependencies]
proptest = "1.11.0"
